<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="200" height="240" fill="#fafafa"/>

  <!-- Column labels -->
  <text x="28" y="230" text-anchor="middle" font-size="8.5" fill="#333" font-weight="600">Protein</text>
  <text x="110" y="230" text-anchor="middle" font-size="8.5" fill="#333" font-weight="600">Pathway</text>
  <text x="178" y="230" text-anchor="middle" font-size="8.5" fill="#333" font-weight="600">Phenotype</text>

  <!-- Probability labels -->
  <text x="66" y="30" text-anchor="middle" font-size="7.5" fill="#333" font-style="italic">p(W</text>
  <text x="79" y="30" text-anchor="middle" font-size="6" fill="#333">1jg</text>
  <text x="85" y="30" text-anchor="middle" font-size="7.5" fill="#333" font-style="italic">)</text>
  <text x="143" y="30" text-anchor="middle" font-size="7.5" fill="#333" font-style="italic">p(W</text>
  <text x="156" y="30" text-anchor="middle" font-size="6" fill="#333">2g</text>
  <text x="162" y="30" text-anchor="middle" font-size="7.5" fill="#333" font-style="italic">)</text>

  <!-- Dashed arrow p(W1) -->
  <line x1="66" y1="32" x2="80" y2="55" stroke="#555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <!-- Dashed arrow p(W2) -->
  <line x1="145" y1="32" x2="158" y2="55" stroke="#555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Protein nodes (blue rings) -->
  <!-- x1 -->
  <circle cx="28" cy="50" r="9" fill="white" stroke="#5C6BC0" stroke-width="2.5"/>
  <text x="28" y="53" text-anchor="middle" font-size="6.5" fill="#333" font-style="italic">x<tspan baseline-shift="sub" font-size="5">1</tspan></text>
  <!-- x2 -->
  <circle cx="28" cy="72" r="9" fill="white" stroke="#5C6BC0" stroke-width="2.5"/>
  <text x="28" y="75" text-anchor="middle" font-size="6.5" fill="#333" font-style="italic">x<tspan baseline-shift="sub" font-size="5">2</tspan></text>
  <!-- x3 -->
  <circle cx="28" cy="94" r="9" fill="white" stroke="#5C6BC0" stroke-width="2.5"/>
  <text x="28" y="97" text-anchor="middle" font-size="6.5" fill="#333" font-style="italic">x<tspan baseline-shift="sub" font-size="5">3</tspan></text>
  <!-- dots -->
  <text x="28" y="112" text-anchor="middle" font-size="10" fill="#555">⋮</text>
  <!-- x300 -->
  <circle cx="28" cy="130" r="9" fill="white" stroke="#5C6BC0" stroke-width="2.5"/>
  <text x="28" y="133" text-anchor="middle" font-size="5.5" fill="#333" font-style="italic">x<tspan baseline-shift="sub" font-size="4.5">300</tspan></text>
  <!-- x301 -->
  <circle cx="28" cy="152" r="9" fill="white" stroke="#5C6BC0" stroke-width="2.5"/>
  <text x="28" y="155" text-anchor="middle" font-size="5.5" fill="#333" font-style="italic">x<tspan baseline-shift="sub" font-size="4.5">301</tspan></text>
  <!-- x302 -->
  <circle cx="28" cy="174" r="9" fill="white" stroke="#5C6BC0" stroke-width="2.5"/>
  <text x="28" y="177" text-anchor="middle" font-size="5.5" fill="#333" font-style="italic">x<tspan baseline-shift="sub" font-size="4.5">302</tspan></text>
  <!-- dots -->
  <text x="28" y="192" text-anchor="middle" font-size="10" fill="#555">⋮</text>
  <!-- xJ -->
  <circle cx="28" cy="210" r="9" fill="white" stroke="#5C6BC0" stroke-width="2.5"/>
  <text x="28" y="213" text-anchor="middle" font-size="5.5" fill="#333" font-style="italic">x<tspan baseline-shift="sub" font-size="4.5">J</tspan></text>

  <!-- Input arrows -->
  <line x1="0" y1="50" x2="18" y2="50" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="0" y1="72" x2="18" y2="72" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="0" y1="94" x2="18" y2="94" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="0" y1="130" x2="18" y2="130" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="0" y1="152" x2="18" y2="152" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="0" y1="174" x2="18" y2="174" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="0" y1="210" x2="18" y2="210" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Pathway nodes (yellow/gold rings) -->
  <!-- pw1 -->
  <circle cx="110" cy="72" r="10" fill="white" stroke="#F9A825" stroke-width="2.5"/>
  <!-- dots -->
  <text x="110" y="125" text-anchor="middle" font-size="10" fill="#555">⋮</text>
  <!-- pw2 -->
  <circle cx="110" cy="148" r="10" fill="white" stroke="#F9A825" stroke-width="2.5"/>
  <!-- dots -->
  <text x="110" y="183" text-anchor="middle" font-size="10" fill="#555">⋮</text>
  <!-- pw3 -->
  <circle cx="110" cy="200" r="10" fill="white" stroke="#F9A825" stroke-width="2.5"/>

  <!-- Phenotype node (purple ring) -->
  <circle cx="178" cy="140" r="10" fill="white" stroke="#7B1FA2" stroke-width="2.5"/>

  <!-- Solid arrows protein→pathway (x1→pw1, x301→pw1, x301→pw2) -->
  <line x1="37" y1="50" x2="99" y2="68" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="37" y1="72" x2="99" y2="72" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="37" y1="152" x2="99" y2="74" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="37" y1="152" x2="99" y2="148" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Dashed arrows (sparse connections) -->
  <line x1="37" y1="94" x2="99" y2="145" stroke="#555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <line x1="37" y1="174" x2="99" y2="152" stroke="#555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <line x1="37" y1="210" x2="99" y2="152" stroke="#555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <line x1="37" y1="174" x2="99" y2="197" stroke="#555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <line x1="37" y1="210" x2="99" y2="202" stroke="#555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Solid arrows pathway→phenotype -->
  <line x1="120" y1="72" x2="167" y2="136" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="120" y1="148" x2="168" y2="142" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Dashed arrow -->
  <line x1="120" y1="200" x2="168" y2="146" stroke="#555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
