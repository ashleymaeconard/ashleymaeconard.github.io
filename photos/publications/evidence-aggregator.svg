<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="320" height="130" fill="white"/>

  <!-- Title -->
  <text x="158" y="13" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1a1a1a">Evidence Aggregator</text>

  <!-- Gene name label + arrow -->
  <text x="5" y="68" font-size="7.5" fill="#333">Gene</text>
  <text x="5" y="78" font-size="7.5" fill="#333">name</text>
  <line x1="28" y1="72" x2="44" y2="72" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L5,2.5 z" fill="#333"/>
    </marker>
  </defs>

  <!-- DNA helix icon (simplified) -->
  <text x="10" y="100" font-size="14" fill="#5C6BC0">🧬</text>

  <!-- ===== Crocodile detective ===== -->
  <!-- Body (teal oval) -->
  <ellipse cx="78" cy="78" rx="22" ry="28" fill="#4DB6AC" stroke="#00897B" stroke-width="1"/>
  <!-- Belly (lighter) -->
  <ellipse cx="78" cy="82" rx="12" ry="18" fill="#B2DFDB"/>
  <!-- Snout -->
  <ellipse cx="78" cy="48" rx="9" ry="6" fill="#4DB6AC" stroke="#00897B" stroke-width="1"/>
  <!-- Snout ridge -->
  <ellipse cx="78" cy="46" rx="9" ry="3.5" fill="#80CBC4"/>
  <!-- Nose dots -->
  <circle cx="75" cy="45" r="1" fill="#00695C"/>
  <circle cx="81" cy="45" r="1" fill="#00695C"/>
  <!-- Eyes -->
  <circle cx="73" cy="53" r="3.5" fill="white" stroke="#333" stroke-width="0.8"/>
  <circle cx="83" cy="53" r="3.5" fill="white" stroke="#333" stroke-width="0.8"/>
  <circle cx="73.8" cy="53.5" r="1.8" fill="#1a1a1a"/>
  <circle cx="83.8" cy="53.5" r="1.8" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="74.5" cy="52.5" r="0.6" fill="white"/>
  <circle cx="84.5" cy="52.5" r="0.6" fill="white"/>
  <!-- Hat (brown detective hat) -->
  <rect x="63" y="38" width="30" height="6" rx="1" fill="#795548" stroke="#5D4037" stroke-width="0.8"/>
  <rect x="67" y="26" width="22" height="14" rx="3" fill="#8D6E63" stroke="#5D4037" stroke-width="0.8"/>
  <!-- Hat band -->
  <rect x="67" y="36" width="22" height="2.5" fill="#5D4037"/>
  <!-- Left arm holding magnifying glass -->
  <line x1="57" y1="80" x2="44" y2="95" stroke="#4DB6AC" stroke-width="4" stroke-linecap="round"/>
  <!-- Magnifying glass circle -->
  <circle cx="40" cy="99" r="6" fill="none" stroke="#78909C" stroke-width="2.5"/>
  <!-- Magnifying glass handle -->
  <line x1="45" y1="104" x2="49" y2="108" stroke="#78909C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Magnifying glass lens -->
  <circle cx="40" cy="99" r="4" fill="rgba(200,220,255,0.3)"/>
  <!-- Right arm -->
  <line x1="99" y1="80" x2="108" y2="90" stroke="#4DB6AC" stroke-width="4" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M 78 106 Q 90 118 85 126 Q 80 118 70 122" fill="none" stroke="#4DB6AC" stroke-width="5" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="68" cy="107" rx="7" ry="4" fill="#4DB6AC" stroke="#00897B" stroke-width="0.8"/>
  <ellipse cx="88" cy="107" rx="7" ry="4" fill="#4DB6AC" stroke="#00897B" stroke-width="0.8"/>
  <!-- Stripe details on belly -->
  <path d="M 70 75 Q 78 78 86 75" fill="none" stroke="#80CBC4" stroke-width="1"/>
  <path d="M 69 83 Q 78 86 87 83" fill="none" stroke="#80CBC4" stroke-width="1"/>

  <!-- ===== Data Table ===== -->
  <!-- Table outer border -->
  <rect x="118" y="20" width="196" height="102" rx="2" fill="white" stroke="#ccc" stroke-width="1"/>

  <!-- Bracket annotation: "Linked patients & variants" -->
  <line x1="148" y1="22" x2="148" y2="27" stroke="#555" stroke-width="1"/>
  <line x1="148" y1="24" x2="225" y2="24" stroke="#555" stroke-width="1"/>
  <line x1="225" y1="22" x2="225" y2="27" stroke="#555" stroke-width="1"/>
  <text x="187" y="23" text-anchor="middle" font-size="6.5" fill="#333">Linked patients &amp; variants</text>

  <!-- Bracket annotation: "Relevant content" -->
  <line x1="230" y1="22" x2="230" y2="27" stroke="#555" stroke-width="1"/>
  <line x1="230" y1="24" x2="308" y2="24" stroke="#555" stroke-width="1"/>
  <line x1="308" y1="22" x2="308" y2="27" stroke="#555" stroke-width="1"/>
  <text x="269" y="23" text-anchor="middle" font-size="6.5" fill="#333">Relevant content</text>

  <!-- Header row background -->
  <rect x="118" y="27" width="196" height="14" fill="#f5f5f5" stroke="#ccc" stroke-width="0.5"/>

  <!-- Column headers -->
  <text x="132" y="37" text-anchor="middle" font-size="7" fill="#333" font-weight="700">Paper</text>
  <line x1="148" y1="27" x2="148" y2="122" stroke="#ccc" stroke-width="0.8"/>
  <text x="160" y="33" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">Indiv.</text>
  <text x="160" y="39" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">ID</text>
  <line x1="173" y1="27" x2="173" y2="122" stroke="#ccc" stroke-width="0.8"/>
  <text x="182" y="33" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">HGVS</text>
  <text x="182" y="39" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">C.</text>
  <line x1="196" y1="27" x2="196" y2="122" stroke="#ccc" stroke-width="0.8"/>
  <text x="213" y="33" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">Pheno.</text>
  <text x="213" y="39" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">(HPO)</text>
  <line x1="230" y1="27" x2="230" y2="122" stroke="#ccc" stroke-width="0.8"/>
  <text x="245" y="33" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">Pop.</text>
  <text x="245" y="39" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">freq.</text>
  <line x1="261" y1="27" x2="261" y2="122" stroke="#ccc" stroke-width="0.8"/>
  <text x="282" y="33" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">Variant</text>
  <text x="282" y="39" text-anchor="middle" font-size="6.5" fill="#333" font-weight="700">type</text>
  <line x1="305" y1="27" x2="305" y2="122" stroke="#ccc" stroke-width="0.8"/>
  <text x="312" y="37" text-anchor="middle" font-size="7" fill="#555">...</text>

  <!-- Row 1 -->
  <rect x="118" y="41" width="196" height="18" fill="white"/>
  <line x1="118" y1="59" x2="314" y2="59" stroke="#eee" stroke-width="0.8"/>
  <text x="132" y="53" text-anchor="middle" font-size="6.5" fill="#333">Choi...</text>
  <text x="160" y="53" text-anchor="middle" font-size="6.5" fill="#333">5</text>
  <text x="182" y="53" text-anchor="middle" font-size="6" fill="#333">c.123G&gt;A</text>
  <text x="213" y="49" text-anchor="middle" font-size="6" fill="#333">Ataxia</text>
  <text x="213" y="56" text-anchor="middle" font-size="6" fill="#333">(HP:00...)</text>
  <text x="245" y="53" text-anchor="middle" font-size="6.5" fill="#333">0.00043</text>
  <text x="282" y="53" text-anchor="middle" font-size="6.5" fill="#333">missense</text>

  <!-- Row 2 -->
  <rect x="118" y="59" width="196" height="18" fill="#fafafa"/>
  <line x1="118" y1="77" x2="314" y2="77" stroke="#eee" stroke-width="0.8"/>
  <text x="132" y="71" text-anchor="middle" font-size="6.5" fill="#333">Gauo...</text>
  <text x="160" y="71" text-anchor="middle" font-size="6.5" fill="#333">i-2</text>
  <text x="182" y="71" text-anchor="middle" font-size="6" fill="#333">c.85G&gt;C</text>
  <text x="213" y="67" text-anchor="middle" font-size="6" fill="#333">Ataxia</text>
  <text x="213" y="74" text-anchor="middle" font-size="6" fill="#333">(HP:00...)</text>
  <text x="245" y="71" text-anchor="middle" font-size="6.5" fill="#333">0</text>
  <text x="282" y="71" text-anchor="middle" font-size="6.5" fill="#333">missense</text>

  <!-- Row 3 -->
  <rect x="118" y="77" width="196" height="18" fill="white"/>
  <line x1="118" y1="95" x2="314" y2="95" stroke="#eee" stroke-width="0.8"/>
  <text x="132" y="89" text-anchor="middle" font-size="6.5" fill="#333">Gauo...</text>
  <text x="160" y="89" text-anchor="middle" font-size="6.5" fill="#333">ii-1</text>
  <text x="182" y="89" text-anchor="middle" font-size="6" fill="#333">c.117G&gt;A</text>
  <text x="213" y="85" text-anchor="middle" font-size="6" fill="#333">Vertigo</text>
  <text x="213" y="92" text-anchor="middle" font-size="6" fill="#333">(HP:0...)</text>
  <text x="245" y="89" text-anchor="middle" font-size="6.5" fill="#333">0.00012</text>
  <text x="282" y="89" text-anchor="middle" font-size="6.5" fill="#333">missense</text>

  <!-- Row 4 ellipsis -->
  <rect x="118" y="95" width="196" height="27" fill="#fafafa"/>
  <text x="215" y="112" text-anchor="middle" font-size="9" fill="#aaa">· · ·</text>
</svg>
